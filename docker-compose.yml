services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ridesnap
      POSTGRES_PASSWORD: ridesnap
      POSTGRES_DB: ridesnap
    ports:
      - '5432:5432'
    volumes:
      - ridesnap_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ridesnap']
      interval: 5s
      timeout: 5s
      retries: 5

  # Uncomment for full stack (build images first: docker compose build)
