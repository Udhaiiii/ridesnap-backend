<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RideSnap – Financial Report</title>
    <script src="/auth.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8f7f4; --surf: #fff; --border: #e5e2db;
      --text: #1a1a1a; --sub: #888; --muted: #bbb;
      --yellow: #f59e0b; --green: #16a34a; --red: #dc2626;
      --blue: #2563eb; --orange: #ea580c;
    }
    body { background: var(--bg); font-family: 'DM Mono', monospace; color: var(--text); min-height: 100vh; }

    .header {
      background: #1a1a1a; color: #fff; padding: 0 28px; height: 52px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 17px; }
    .logo span { color: var(--yellow); }
    .header-right { display: flex; gap: 10px; align-items: center; }
    .btn {
      padding: 7px 16px; border-radius: 8px; font-family: 'DM Mono', monospace;
      font-size: 11px; font-weight: 700; cursor: pointer; border: none; transition: all .15s;
    }
    .btn-dark   { background: #2a2a2a; color: #aaa; border: 1px solid #444; }
    .btn-dark:hover   { border-color: var(--yellow); color: var(--yellow); }
    .btn-yellow { background: var(--yellow); color: #000; }
    .btn-yellow:hover { background: #fbbf24; }
    .btn-green  { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .btn-green:hover  { background: #bbf7d0; }

    .main { max-width: 1100px; margin: 0 auto; padding: 28px 24px 60px; }

    /* Date selector */
    .date-bar {
      background: var(--surf); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px 20px; margin-bottom: 24px;
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }
    .date-bar label { font-size: 10px; letter-spacing: 2px; color: var(--sub); text-transform: uppercase; }
    .date-bar input {
      padding: 9px 14px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; font-family: 'DM Mono', monospace; font-size: 13px;
      outline: none; color: var(--text); transition: border .15s;
    }
    .date-bar input:focus { border-color: var(--yellow); }
    .date-shortcuts { display: flex; gap: 6px; flex-wrap: wrap; }
    .shortcut {
      padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
      background: var(--bg); font-size: 10px; cursor: pointer; transition: all .15s;
    }
    .shortcut:hover { border-color: #aaa; }
    .shortcut.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

    /* KPI cards */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-card {
      background: var(--surf); border: 1px solid var(--border); border-radius: 12px;
      padding: 18px; transition: box-shadow .15s;
    }
    .kpi-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.06); }
    .kpi-icon  { font-size: 22px; margin-bottom: 10px; }
    .kpi-val   { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 26px; margin-bottom: 4px; }
    .kpi-label { font-size: 10px; letter-spacing: 1.5px; color: var(--sub); text-transform: uppercase; }
    .kpi-card.revenue .kpi-val  { color: var(--yellow); }
    .kpi-card.orders  .kpi-val  { color: var(--blue); }
    .kpi-card.avg     .kpi-val  { color: var(--green); }
    .kpi-card.guests  .kpi-val  { color: var(--orange); }

    /* Section */
    .section-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* Grid layout */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    @media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }

    .card { background: var(--surf); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }

    /* Tables */
    table { width: 100%; border-collapse: collapse; }
    th { font-size: 9px; letter-spacing: 2px; color: var(--sub); padding: 10px 12px; text-align: left; background: #fafaf8; border-bottom: 1px solid var(--border); text-transform: uppercase; }
    td { padding: 11px 12px; border-bottom: 1px solid var(--border); font-size: 12px; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafaf8; }

    /* Bar chart */
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .bar-label { font-size: 11px; width: 100px; flex-shrink: 0; color: var(--sub); }
    .bar-track { flex: 1; height: 20px; background: var(--bg); border-radius: 4px; overflow: hidden; }
    .bar-fill  { height: 100%; background: var(--yellow); border-radius: 4px; transition: width .5s; display: flex; align-items: center; padding-left: 8px; }
    .bar-fill span { font-size: 10px; font-weight: 700; color: #000; white-space: nowrap; }
    .bar-amt { font-size: 11px; font-weight: 700; width: 70px; text-align: right; }

    /* Orders table */
    .orders-wrap { background: var(--surf); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 24px; }
    .orders-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .orders-header .title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; }
    .badge { background: #fefce8; border: 1px solid #fde68a; color: var(--orange); padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; }

    /* Loading */
    .loading { text-align: center; padding: 60px; color: var(--sub); }
    .loading-icon { font-size: 36px; margin-bottom: 12px; animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Empty */
    .empty { text-align: center; padding: 40px; color: var(--sub); }
    .empty-icon { font-size: 40px; margin-bottom: 10px; }

    /* Payment badge */
    .pay-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; }
    .pb-cash { background: #f0fdf4; color: var(--green); }
    .pb-upi  { background: #ede9fe; color: #5b21b6; }
    .pb-card { background: #dbeafe; color: var(--blue); }
    .pb-split { background: #fef3c7; color: var(--orange); }

    /* Type badge */
    .type-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; }
    .tb-digital { background: #f0fdf4; color: var(--green); }
    .tb-print   { background: #fef3c7; color: var(--orange); }
    .tb-frame   { background: #ede9fe; color: #5b21b6; }
    .tb-combo   { background: #dbeafe; color: var(--blue); }

    @media print {
      .header, .date-bar, .btn, #exportBtns { display: none !important; }
      body { background: #fff; }
      .card, .orders-wrap { box-shadow: none; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">📊 RideSnap <span>Financial Report</span></div>
  <div class="header-right">
    <span style="font-size:11px;color:#aaa;font-family:'DM Mono',monospace">👤 <span id="hdrUserName">—</span></span>
    <button class="btn btn-dark" onclick="window.location.href='/'">← Portal</button>
    <button class="btn btn-dark" onclick="rsLogout()" style="border-color:#7f1d1d;color:#f87171">⏻ Logout</button>
    <button class="btn btn-dark" onclick="window.print()">🖨️ Print</button>
    <button class="btn btn-green" onclick="exportExcel()">📥 Export Excel</button>
  </div>
</div>

<div class="main">

  <!-- Date selector -->
  <div class="date-bar">
    <label>Report Date</label>
    <input type="date" id="reportDate" onchange="loadReport()"/>
    <div class="date-shortcuts">
      <span class="shortcut active" onclick="setDate(0)">Today</span>
      <span class="shortcut" onclick="setDate(-1)">Yesterday</span>
      <span class="shortcut" onclick="setDate(-7)">7 Days Ago</span>
    </div>
    <div id="exportBtns" style="margin-left:auto;display:flex;gap:8px">
      <button class="btn btn-green" onclick="exportExcel()">📥 Excel</button>
    </div>
  </div>

  <div id="reportContent">
    <div class="loading">
      <div class="loading-icon">⏳</div>
      <div>Loading report...</div>
    </div>
  </div>

</div>

<script>

  // Auth check
  (async () => {
    const user = await requireAuth(["admin"]);
    if (user) {
      const n = document.getElementById('hdrUserName');
      if (n) n.textContent = user.name;
    }
  })();

  const API = (window.location.hostname==='localhost'||window.location.hostname==='127.0.0.1')
    ? 'http://localhost:5000/api' : window.location.origin+'/api';

  let reportData = null;

  // Init
  window.onload = () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('reportDate').value = today;
    loadReport();
  };

  function setDate(daysAgo) {
    const d = new Date();
    d.setDate(d.getDate() + daysAgo);
    document.getElementById('reportDate').value = d.toISOString().split('T')[0];
    document.querySelectorAll('.shortcut').forEach(s => s.classList.remove('active'));
    event.target.classList.add('active');
    loadReport();
  }

  // ── LOAD REPORT ───────────────────────────────────────────────
  async function loadReport() {
    const date = document.getElementById('reportDate').value;
    document.getElementById('reportContent').innerHTML = `
      <div class="loading"><div class="loading-icon">⏳</div><div>Loading...</div></div>`;

    try {
      const res  = await fetch(`${API}/reports/daily?date=${date}`);
      const data = await res.json();

      if (!data.success) throw new Error(data.error);
      reportData = data.report;
      renderReport(data.report);
    } catch(e) {
      document.getElementById('reportContent').innerHTML = `
        <div class="empty"><div class="empty-icon">⚠️</div><div>${e.message}</div></div>`;
    }
  }

  // ── RENDER ────────────────────────────────────────────────────
  function renderReport(r) {
    const dateLabel = new Date(r.date + 'T00:00:00').toLocaleDateString('en-IN', {
      weekday: 'long', day: '2-digit', month: 'long', year: 'numeric'
    });

    const payLabels  = { cash:'💵 Cash', upi:'📱 UPI', card:'💳 Card', split:'✂️ Split', razorpay:'🔗 Online' };
    const typeLabels = { digital:'Digital', print:'Print', frame:'Frame', combo:'Combo' };

    // Payment breakdown bars
    const maxPayAmt = Math.max(...Object.values(r.by_payment).map(p => p.amount), 1);
    const payBars = Object.entries(r.by_payment).map(([mode, data]) => {
      const pct = Math.round((data.amount / maxPayAmt) * 100);
      return `<div class="bar-row">
        <div class="bar-label">${payLabels[mode]||mode}</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${pct}%">
            <span>${data.count} orders</span>
          </div>
        </div>
        <div class="bar-amt">₹${data.amount.toLocaleString('en-IN')}</div>
      </div>`;
    }).join('');

    // Hourly breakdown
    const hourlyRows = Object.entries(r.by_hour).sort().map(([hour, data]) => `
      <tr>
        <td>${hour}</td>
        <td>${data.count}</td>
        <td style="color:var(--yellow);font-weight:700">₹${data.amount.toLocaleString('en-IN')}</td>
      </tr>`).join('');

    // Ride breakdown
    const rideRows = Object.entries(r.by_ride).sort((a,b) => b[1].amount - a[1].amount).map(([ride, data]) => `
      <tr>
        <td>🎢 ${ride}</td>
        <td>${data.count}</td>
        <td style="color:var(--yellow);font-weight:700">₹${data.amount.toLocaleString('en-IN')}</td>
      </tr>`).join('');

    // Orders table
    const orderRows = r.orders.map(o => {
      const payClass = { cash:'pb-cash', upi:'pb-upi', card:'pb-card', split:'pb-split' }[o.payment_mode] || 'pb-cash';
      const typeClass= { digital:'tb-digital', print:'tb-print', frame:'tb-frame', combo:'tb-combo' }[o.order_type] || 'tb-digital';
      const time = new Date(o.created_at).toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', hour12:true });
      return `<tr>
        <td style="font-family:monospace">${o.id}</td>
        <td>${o.guest_name || 'Guest'}</td>
        <td>${o.ride_name || '—'}</td>
        <td><span class="type-badge ${typeClass}">${typeLabels[o.order_type]||o.order_type}</span></td>
        <td><span class="pay-badge ${payClass}">${payLabels[o.payment_mode]||o.payment_mode||'Cash'}</span></td>
        <td style="font-weight:700;color:var(--yellow)">₹${o.price}</td>
        <td style="color:var(--sub)">${time}</td>
        <td>
          <a href="/receipt.html?order_id=${o.id}" target="_blank"
             style="color:var(--blue);text-decoration:none;font-size:10px">🧾 View</a>
        </td>
      </tr>`;
    }).join('');

    document.getElementById('reportContent').innerHTML = `

      <!-- Date heading -->
      <div style="margin-bottom:20px">
        <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:22px">${dateLabel}</div>
        <div style="font-size:11px;color:var(--sub);margin-top:4px">${r.park_name} · Generated ${new Date().toLocaleTimeString('en-IN')}</div>
      </div>

      <!-- KPI Cards -->
      <div class="kpi-grid">
        <div class="kpi-card revenue">
          <div class="kpi-icon">💰</div>
          <div class="kpi-val">₹${r.summary.total_revenue.toLocaleString('en-IN')}</div>
          <div class="kpi-label">Total Revenue</div>
        </div>
        <div class="kpi-card orders">
          <div class="kpi-icon">📦</div>
          <div class="kpi-val">${r.summary.total_orders}</div>
          <div class="kpi-label">Total Orders</div>
        </div>
        <div class="kpi-card avg">
          <div class="kpi-icon">📊</div>
          <div class="kpi-val">₹${r.summary.avg_order}</div>
          <div class="kpi-label">Avg Order Value</div>
        </div>
        <div class="kpi-card guests">
          <div class="kpi-icon">👥</div>
          <div class="kpi-val">${Object.keys(r.by_ride).length}</div>
          <div class="kpi-label">Rides Active</div>
        </div>
      </div>

      <!-- Payment + Type breakdown -->
      <div class="two-col">

        <!-- Payment breakdown -->
        <div class="card">
          <div class="section-title">Payment Modes</div>
          ${payBars || '<div class="empty"><div class="empty-icon">💳</div>No orders</div>'}
        </div>

        <!-- Order type breakdown -->
        <div class="card">
          <div class="section-title">Order Types</div>
          <table>
            <thead><tr><th>Type</th><th>Count</th><th>Revenue</th><th>%</th></tr></thead>
            <tbody>
              ${Object.entries(r.by_type).sort((a,b)=>b[1].amount-a[1].amount).map(([type, data]) => `
                <tr>
                  <td><span class="type-badge tb-${type}">${typeLabels[type]||type}</span></td>
                  <td>${data.count}</td>
                  <td style="font-weight:700;color:var(--yellow)">₹${data.amount.toLocaleString('en-IN')}</td>
                  <td style="color:var(--sub)">${r.summary.total_revenue ? Math.round(data.amount/r.summary.total_revenue*100) : 0}%</td>
                </tr>`).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--sub)">No data</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>

      <!-- Ride + Hourly breakdown -->
      <div class="two-col">
        <div class="card">
          <div class="section-title">Revenue by Ride</div>
          <table>
            <thead><tr><th>Ride</th><th>Orders</th><th>Revenue</th></tr></thead>
            <tbody>${rideRows || '<tr><td colspan="3" style="text-align:center;color:var(--sub)">No data</td></tr>'}</tbody>
          </table>
        </div>
        <div class="card">
          <div class="section-title">Hourly Breakdown</div>
          <table>
            <thead><tr><th>Hour</th><th>Orders</th><th>Revenue</th></tr></thead>
            <tbody>${hourlyRows || '<tr><td colspan="3" style="text-align:center;color:var(--sub)">No data</td></tr>'}</tbody>
          </table>
        </div>
      </div>

      <!-- All Orders Table -->
      <div class="orders-wrap">
        <div class="orders-header">
          <div class="title">All Orders</div>
          <span class="badge">${r.summary.total_orders} orders · ₹${r.summary.total_revenue.toLocaleString('en-IN')}</span>
        </div>
        ${r.orders.length === 0
          ? '<div class="empty"><div class="empty-icon">📭</div><div>No orders on this date</div></div>'
          : `<div style="overflow-x:auto"><table>
              <thead>
                <tr>
                  <th>Order ID</th><th>Guest</th><th>Ride</th>
                  <th>Type</th><th>Payment</th><th>Amount</th>
                  <th>Time</th><th>Receipt</th>
                </tr>
              </thead>
              <tbody>${orderRows}</tbody>
             </table></div>`
        }
      </div>

      <!-- Disclaimer -->
      <div style="background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:14px 18px;font-size:11px;color:var(--sub);line-height:1.7">
        ℹ️ <strong>Note:</strong> This is an internal financial summary for business records.
        GST registration is not active — amounts shown are inclusive of all applicable charges.
        This document is for internal audit and CA reference only.
        Generated on ${new Date().toLocaleString('en-IN')}.
      </div>
    `;
  }

  // ── EXPORT EXCEL ──────────────────────────────────────────────
  function exportExcel() {
    if (!reportData) { alert('Load a report first'); return; }
    const r    = reportData;
    const date = r.date;

    const wb = XLSX.utils.book_new();

    // Sheet 1 — Summary
    const summaryData = [
      ['WONDERLA AMUSEMENT PARK — DAILY FINANCIAL REPORT'],
      ['Date:', date],
      ['Park:', r.park_name],
      ['Generated:', new Date().toLocaleString('en-IN')],
      [''],
      ['SUMMARY'],
      ['Total Revenue (₹)', r.summary.total_revenue],
      ['Total Orders',       r.summary.total_orders],
      ['Average Order (₹)', r.summary.avg_order],
      [''],
      ['PAYMENT MODE BREAKDOWN'],
      ['Mode', 'Orders', 'Amount (₹)'],
      ...Object.entries(r.by_payment).map(([mode, d]) => [mode.toUpperCase(), d.count, d.amount]),
      [''],
      ['ORDER TYPE BREAKDOWN'],
      ['Type', 'Orders', 'Amount (₹)'],
      ...Object.entries(r.by_type).map(([type, d]) => [type.toUpperCase(), d.count, d.amount]),
      [''],
      ['RIDE BREAKDOWN'],
      ['Ride', 'Orders', 'Amount (₹)'],
      ...Object.entries(r.by_ride).map(([ride, d]) => [ride, d.count, d.amount]),
      [''],
      ['NOTE: GST not registered. Amounts are final sale prices.'],
    ];
    const ws1 = XLSX.utils.aoa_to_sheet(summaryData);
    ws1['!cols'] = [{wch:35},{wch:15},{wch:15}];
    XLSX.utils.book_append_sheet(wb, ws1, 'Summary');

    // Sheet 2 — All Orders
    const orderHeaders = ['Order ID','Guest Name','Phone','Wristband','Ride','Package','Payment Mode','Amount (₹)','Status','Time'];
    const orderRows = r.orders.map(o => [
      o.id,
      o.guest_name || 'Guest',
      o.phone || '',
      o.visit_id,
      o.ride_name || '',
      o.order_type,
      o.payment_mode || 'cash',
      o.price,
      o.payment_status,
      new Date(o.created_at).toLocaleTimeString('en-IN'),
    ]);
    const ws2 = XLSX.utils.aoa_to_sheet([orderHeaders, ...orderRows]);
    ws2['!cols'] = [{wch:14},{wch:18},{wch:14},{wch:12},{wch:16},{wch:10},{wch:12},{wch:10},{wch:10},{wch:12}];

    // Style header row
    const range = XLSX.utils.decode_range(ws2['!ref']);
    for (let C = range.s.c; C <= range.e.c; C++) {
      const cell = ws2[XLSX.utils.encode_cell({ r:0, c:C })];
      if (cell) cell.s = { font: { bold: true }, fill: { fgColor: { rgb: 'FFF59E0B' } } };
    }
    XLSX.utils.book_append_sheet(wb, ws2, 'Orders');

    // Sheet 3 — Hourly
    const hourlyHeaders = ['Hour', 'Orders', 'Revenue (₹)'];
    const hourlyRows = Object.entries(r.by_hour).sort().map(([h, d]) => [h, d.count, d.amount]);
    const ws3 = XLSX.utils.aoa_to_sheet([hourlyHeaders, ...hourlyRows]);
    XLSX.utils.book_append_sheet(wb, ws3, 'Hourly');

    // Download
    XLSX.writeFile(wb, `RideSnap_Report_${date}.xlsx`);
  }
</script>
</body>
</html>
